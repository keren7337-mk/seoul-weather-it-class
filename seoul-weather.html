<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>서울 현재 날씨</title>
  <style>
    :root {
      font-family: "Geist", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      color: #162c32;
      background: #f3f6f5;
      font-synthesis: none;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    button { font: inherit; }
    [hidden] { display: none !important; }

    .page {
      width: min(960px, calc(100% - 48px));
      margin-inline: auto;
      padding-block: clamp(28px, 7vw, 80px) 32px;
    }

    .location {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 24px;
      margin-bottom: 17px;
    }

    .city {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
    }

    .city-marker {
      width: 13px;
      height: 13px;
      border: 4px solid #1a7068;
      border-radius: 50%;
    }

    .coordinates {
      color: #516862;
      font: 12px/1.5 "IBM Plex Mono", ui-monospace, monospace;
      letter-spacing: .035em;
    }

    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-height: 280px;
      display: grid;
      align-content: center;
      justify-items: start;
      padding: clamp(24px, 6vw, 56px);
      border-radius: 24px;
      background: linear-gradient(112deg, #122c34 12%, #173e45 100%);
      color: #f3fffb;
    }

    .hero h1 {
      margin: 0 0 28px;
      font-size: clamp(39px, 7vw, 68px);
      font-weight: 750;
      line-height: 1.12;
      letter-spacing: -.065em;
    }

    .hero-art {
      position: absolute;
      z-index: -1;
      inset: 0 0 0 37%;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 63% 50%, #77d8bc22, transparent 65%),
        linear-gradient(#c0ffef12 1px, transparent 1px),
        linear-gradient(90deg, #c0ffef12 1px, transparent 1px);
      background-size: auto, 32px 32px, 32px 32px;
      mask-image: linear-gradient(90deg, transparent, #000 48%);
    }

    .crosshair {
      position: absolute;
      top: 50%;
      left: 65%;
      width: 340px;
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(circle, #d7ffef 0 4px, #8aefce32 5px 13px, transparent 14px),
        repeating-radial-gradient(circle, transparent 0 43px, #b7ffe744 44px 45px),
        linear-gradient(transparent 49.85%, #b7ffe75c 50%, transparent 50.3%),
        linear-gradient(90deg, transparent 49.85%, #b7ffe75c 50%, transparent 50.3%);
    }

    .lookup {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 50px;
      padding: 11px 20px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: #a3e9ce;
      color: #153c37;
      font-weight: 750;
      cursor: pointer;
    }

    .lookup:hover { background: #c0f5df; }
    .lookup:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .lookup[aria-disabled="true"] { cursor: wait; background: #b4dbce; }
    .lookup-icon { font-size: 22px; line-height: 1; }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 24px;
      margin: 23px 0 12px;
      color: #4a625f;
      font-size: 14px;
      line-height: 1.55;
    }

    .status-dot {
      flex: 0 0 8px;
      height: 8px;
      border-radius: 50%;
      background: #758783;
    }

    .status[data-state="loading"] .status-dot {
      background: #a86a19;
      animation: pulse 1.4s ease-in-out infinite alternate;
    }

    .status[data-state="success"] .status-dot { background: #27846e; }
    .status[data-state="error"] { color: #9a332e; }
    .status[data-state="error"] .status-dot { background: #b34338; }

    @keyframes pulse { to { opacity: .4; } }
    @media (prefers-reduced-motion: reduce) {
      .status[data-state="loading"] .status-dot { animation: none; }
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin: 0;
    }

    .metric {
      min-width: 0;
      padding: clamp(17px, 3vw, 26px);
      border: 1px solid #d8e4e0;
      border-radius: 16px;
      background: #fff;
    }

    .metric dt {
      color: #4a625f;
      font-size: 14px;
      font-weight: 700;
    }

    .metric dd {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0 .22em;
      margin: 9px 0 0;
      font-size: clamp(29px, 6vw, 52px);
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.05em;
      line-height: 1.15;
    }

    .metric-unit { color: #4a625f; font-size: .46em; letter-spacing: 0; }

    footer {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px 20px;
      margin-top: 22px;
      color: #516862;
      font-size: 13px;
      line-height: 1.5;
    }

    footer a { color: #1b6258; font-weight: 700; text-underline-offset: .22em; }
    footer a:focus-visible { outline: 2px solid #1b6258; outline-offset: 4px; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 540px) {
      .page { width: calc(100% - 32px); }
      .hero { min-height: 230px; border-radius: 18px; }
      .hero-art { inset-inline-start: 22%; opacity: .65; }
      .crosshair { left: 84%; }
      .metrics { gap: 10px; }
    }

    @media (max-width: 300px) {
      .metrics { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="location">
      <span class="city"><span class="city-marker" aria-hidden="true"></span>서울, 대한민국</span>
      <span class="coordinates">37.5665° N · 126.9780° E</span>
    </header>

    <main>
      <div class="hero">
        <div class="hero-art" aria-hidden="true"><div class="crosshair"></div></div>
        <h1>현재 날씨</h1>
        <button class="lookup" id="lookup" type="button">
          <span class="lookup-icon" aria-hidden="true">↻</span>
          날씨 조회
        </button>
      </div>

      <p class="status" id="status" role="status" aria-atomic="true" data-state="idle">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="message">조회 대기 중</span>
      </p>

      <dl class="metrics">
        <div class="metric">
          <dt>현재 기온</dt>
          <dd><span id="temperature">—</span><span class="metric-unit" id="temperature-unit" hidden>°C</span></dd>
        </div>
        <div class="metric">
          <dt>상대습도</dt>
          <dd><span id="humidity">—</span><span class="metric-unit" id="humidity-unit" hidden>%</span></dd>
        </div>
      </dl>
      <noscript><p>날씨를 조회하려면 브라우저에서 JavaScript를 켜 주세요.</p></noscript>
    </main>

    <footer>
      <span>
        데이터 출처 <a href="https://open-meteo.com/">Open-Meteo</a>
        · <a href="https://creativecommons.org/licenses/by/4.0/deed.ko">CC BY 4.0</a>
      </span>
      <a href="./seoul-weather.html" download="seoul-weather.html">HTML 다운로드</a>
    </footer>
  </div>

  <script>
    const endpoint = new URL('https://api.open-meteo.com/v1/forecast');
    endpoint.search = new URLSearchParams({
      latitude: '37.5665',
      longitude: '126.9780',
      current: 'temperature_2m,relative_humidity_2m',
      temperature_unit: 'celsius',
      timezone: 'Asia/Seoul',
      timeformat: 'unixtime'
    });

    const button = document.getElementById('lookup');
    const status = document.getElementById('status');
    const message = document.getElementById('message');
    const temperature = document.getElementById('temperature');
    const temperatureUnit = document.getElementById('temperature-unit');
    const humidity = document.getElementById('humidity');
    const humidityUnit = document.getElementById('humidity-unit');
    const seoulTime = new Intl.DateTimeFormat('ko-KR', {
      timeZone: 'Asia/Seoul',
      month: 'long',
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit',
      hourCycle: 'h23'
    });

    button.addEventListener('click', async () => {
      if (button.getAttribute('aria-disabled') === 'true') return;

      button.setAttribute('aria-disabled', 'true');
      status.dataset.state = 'loading';
      message.textContent = '날씨 정보를 불러오는 중입니다…';
      temperature.textContent = '—';
      humidity.textContent = '—';
      temperatureUnit.hidden = true;
      humidityUnit.hidden = true;

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 12000);

      try {
        const response = await fetch(endpoint, { signal: controller.signal, cache: 'no-store' });
        if (!response.ok) throw new Error(`Open-Meteo HTTP ${response.status}`);

        const data = await response.json();
        const current = data?.current;
        if (!Number.isFinite(current?.temperature_2m) ||
            !Number.isFinite(current?.relative_humidity_2m) ||
            current.relative_humidity_2m < 0 || current.relative_humidity_2m > 100 ||
            !Number.isFinite(current?.time)) {
          throw new Error('Invalid current weather response');
        }

        const time = seoulTime.format(new Date(current.time * 1000));
        temperature.textContent = current.temperature_2m;
        humidity.textContent = current.relative_humidity_2m;
        temperatureUnit.hidden = false;
        humidityUnit.hidden = false;

        const summary = document.createElement('span');
        summary.className = 'visually-hidden';
        summary.textContent = ` 현재 기온 섭씨 ${current.temperature_2m}도, 상대습도 ${current.relative_humidity_2m}퍼센트.`;
        status.dataset.state = 'success';
        message.replaceChildren(`데이터 기준 시각 ${time} (한국 시간)`, summary);
      } catch {
        status.dataset.state = 'error';
        message.textContent = controller.signal.aborted
          ? '응답 시간이 초과됐습니다. 다시 조회해 주세요.'
          : '날씨 정보를 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 조회해 주세요.';
      } finally {
        clearTimeout(timeout);
        button.removeAttribute('aria-disabled');
      }
    });
  </script>
</body>
</html>
